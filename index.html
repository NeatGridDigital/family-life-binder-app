*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--p)}
h1,h2,h3,.serif{font-family:Newsreader,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:30px;line-height:1.15}h2{font-size:24px;line-height:1.2}h3{font-size:19px}
.muted{color:var(--mut)}.small{font-size:14px}.tiny{font-size:12.5px}
#print{display:none}
/* shell */
.top{background:var(--band);color:var(--bandtx);padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.top .brand{font-family:Newsreader,serif;font-weight:600;font-size:22px;line-height:1.1}
.top .who{font-size:13px;opacity:.75}
.top .sp{flex:1}
.ibtn{background:transparent;border:0;color:inherit;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:rgba(255,255,255,.12)}
.ibtn svg,.nav svg,.tile svg,.row svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.layout{display:block}
main{max-width:880px;margin:0 auto;padding:18px 16px 110px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mut);padding:6px 8px;border-radius:12px;cursor:pointer;min-width:58px}
.nav button.on{color:var(--p);font-weight:600}
.nav .secs{display:none}
@media (min-width:960px){
 .layout{display:grid;grid-template-columns:260px 1fr;align-items:start}
 .nav{position:sticky;top:70px;flex-direction:column;justify-content:flex-start;border:0;border-right:1px solid var(--line);height:calc(100vh - 70px);overflow:auto;padding:16px 12px;background:transparent;gap:2px}
 .nav button{flex-direction:row;gap:12px;font-size:15px;padding:9px 12px;width:100%;justify-content:flex-start;color:var(--tx)}
 .nav button.on{background:var(--soft);color:var(--p)}
 .nav .secs{display:block;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
 .nav .secs .lab{padding:0 12px 6px}
 .nav .secs button{font-size:14px;padding:7px 12px}
 .nav .secs i{margin-left:auto;font-style:normal;font-size:12px;color:var(--mut)}
 main{padding:26px 28px 60px;margin:0}
}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.lab{font-size:13px;color:var(--mut);font-weight:500}
.grid2{display:grid;gap:14px}
@media (min-width:700px){.grid2{grid-template-columns:1fr 1fr}.grid2>.card{margin-bottom:0}.grid2{margin-bottom:14px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--p);color:#fff;border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px;cursor:pointer;min-height:44px;text-decoration:none}
[data-theme=dark] .btn{color:var(--atx)}
.btn.gold{background:var(--a);color:var(--atx)}
.btn.ghost{background:transparent;color:var(--p);border:1.5px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1.5px solid var(--line)}
.btn.sm{padding:7px 14px;min-height:36px;font-size:14px}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--mut)}
.pill.done{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.gold{background:color-mix(in srgb,var(--a) 22%,transparent);color:color-mix(in srgb,var(--a) 60%,var(--tx))}
.pill.prog{background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 55%,var(--tx))}
/* home hero */
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:132px;height:132px;flex:none}
.ring .arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)}
.hero h2{font-size:27px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh);min-height:118px}
.tile:hover{border-color:var(--c)}
.tile .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--p)}
.tile b{font-size:15px;line-height:1.25}
.tile .st{font-size:12.5px;color:var(--mut);margin-top:auto;display:flex;justify-content:space-between}
.bar{height:7px;border-radius:99px;background:var(--trk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c);width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.bar i.full{background:var(--p)}.bar i.low{background:var(--a)}
.miss{list-style:none;margin:8px 0 0;padding:0}
.miss li button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);width:100%;font-size:15px}
.miss li:first-child button{border-top:0}
.miss .dot{width:9px;height:9px;border-radius:50%;background:var(--a);margin-top:8px;flex:none}
.banner{background:color-mix(in srgb,var(--a) 16%,var(--card));border:1px solid color-mix(in srgb,var(--a) 40%,var(--line));border-radius:16px;padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14.5px}
.banner .sp{flex:1;min-width:180px}
.inote{display:flex;align-items:center;gap:10px;background:var(--card);border:1px dashed var(--c);border-radius:16px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.inote span{flex:1}
.ix{background:none;border:0;font-size:22px;color:var(--mut);cursor:pointer;width:36px;height:36px}
/* section page */
.back{all:unset;cursor:pointer;color:var(--mut);font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:8px}
.shead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.shead .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--p);flex:none}
.shead .ic svg{width:26px;height:26px}
.ghead{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.ghead h3{flex:1}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;box-shadow:var(--sh)}
.item:hover{border-color:var(--c)}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-weight:600}.item .t span{font-size:13.5px;color:var(--mut)}
.chk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chk svg{width:14px;height:14px;stroke-width:3}
.chk.no{background:color-mix(in srgb,var(--a) 20%,transparent);color:var(--a)}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:4px 14px;font-size:15px}
.kv div{padding:7px 0;border-top:1px solid var(--line)}
.kv div:nth-child(-n+2){border-top:0}
.kv .k{color:var(--mut);font-size:14px}
.kv .v{white-space:pre-wrap;word-break:break-word}
.kv .v.empty{color:var(--mut);font-style:italic}
.empty-g{border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--mut);font-size:14.5px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--p)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:12px 18px;margin-bottom:14px}
/* forms / sheet */
.veil{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.7,.2,1)}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:22px;max-height:86vh}}
.sheet h2{margin-bottom:12px}
.f{display:block;margin-bottom:14px}
.f>span{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;margin-bottom:5px}
.f .key{width:7px;height:7px;border-radius:50%;background:var(--a)}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;min-height:46px}
.f textarea{min-height:84px;resize:vertical}
.f textarea.big{min-height:260px;font-family:Newsreader,Georgia,serif;font-size:18px;line-height:1.55}
.f small{display:block;color:var(--mut);font-size:12.5px;margin-top:4px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2.5px solid color-mix(in srgb,var(--c) 70%,transparent);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.seg button.on{border-color:var(--p);color:var(--p);font-weight:600}
.sw{display:inline-flex;gap:6px;align-items:center}
.sw i{width:16px;height:16px;border-radius:50%;display:inline-block}
.legend{font-size:12.5px;color:var(--mut);display:flex;gap:6px;align-items:center;margin:-4px 0 14px}
.legend i{width:7px;height:7px;border-radius:50%;background:var(--a)}
/* lock + keypad */
.lockwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;background:var(--band);color:var(--bandtx);text-align:center}
.lockwrap h1{font-size:32px;margin:14px 0 4px}
.lockwrap .sub{opacity:.8;margin-bottom:22px}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0 20px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;opacity:.7}
.dots i.on{background:var(--a);border-color:var(--a);opacity:1}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.pad button{width:76px;height:64px;border-radius:18px;border:0;background:rgba(255,255,255,.1);color:inherit;font-size:24px;cursor:pointer}
.pad button:active{background:rgba(255,255,255,.22)}
.pad button.txt{font-size:13px;background:transparent}
.lockwrap .btn{margin-top:18px}
.lockwrap .msg{min-height:24px;margin-top:12px;color:var(--a);font-weight:600}
.lockwrap input{width:min(320px,100%);border:0;border-radius:14px;padding:14px;font-size:17px;text-align:center;background:rgba(255,255,255,.12);color:inherit}
.lockwrap .link{all:unset;cursor:pointer;opacity:.8;font-size:14px;margin-top:16px;text-decoration:underline}
.sheet .pad button{background:var(--soft);color:var(--tx)}
.sheet .dots{color:var(--p)}
.sheet .pad button.txt{background:transparent}
/* welcome */
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:560px;margin:0 auto;padding:40px 22px}
.welcome .logo{width:76px;height:76px;border-radius:20px;margin-bottom:18px}
.welcome h1{font-size:40px;margin-bottom:8px}
.welcome .lead{font-size:18px;color:var(--mut);margin:0 0 22px}
.welcome ul{list-style:none;padding:0;margin:0 0 26px}
.welcome li{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.welcome li i{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;flex:none;font-style:normal;font-weight:700;font-size:14px}
/* emergency */
.ecard{border-top:6px solid var(--a)}
.ecard .nm{font-size:30px;margin:4px 0 12px}
.ecard .big{font-size:17px;font-weight:600}
.tel{color:var(--p);font-weight:600;text-decoration:none}
/* toast */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14.5px;z-index:60;animation:up .25s}
@media (min-width:960px){.toast{bottom:28px}}
.foot{font-size:12.5px;color:var(--mut);text-align:center;margin:26px 0 0}
/* motion (calm) */
.fade{animation:fadeup .45s cubic-bezier(.2,.7,.2,1) both}
.fade:nth-child(2){animation-delay:.05s}.fade:nth-child(3){animation-delay:.1s}.fade:nth-child(4){animation-delay:.15s}.fade:nth-child(5){animation-delay:.2s}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .35s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* print */
@media print{
 @page{margin:14mm 14mm 16mm}
 body{background:#fff!important;color:#111}
 #app,.veil,.toast{display:none!important}
 #print{display:block;font:11pt/1.45 Inter,Arial,sans-serif;color:#111}
 #print h1,#print h2,#print h3{font-family:Newsreader,Georgia,serif;color:#1B2433}
 #print .pg{break-after:page}
 #print .cover{text-align:center;padding-top:40mm}
 #print .cover h1{font-size:34pt;margin-bottom:6mm}
 #print .cover .nm{font-size:20pt;font-family:Newsreader,Georgia,serif}
 #print .cover .note{border:1px solid #ccc;border-left:4px solid #C8963E;text-align:left;padding:5mm 6mm;margin:14mm auto 0;max-width:140mm;font-size:12pt;white-space:pre-wrap}
 #print .cover ol{text-align:left;max-width:140mm;margin:10mm auto 0}
 #print .ps h2{font-size:20pt;border-bottom:2px solid #C8963E;padding-bottom:2mm;margin-bottom:4mm}
 #print .ps h3{font-size:13pt;margin:5mm 0 2mm}
 #print table{width:100%;border-collapse:collapse;margin-bottom:3mm;break-inside:avoid}
 #print td{border:1px solid #d8d8d8;padding:1.6mm 2.4mm;vertical-align:top;white-space:pre-wrap}
 #print td.k{width:38%;color:#555;background:#f6f4ef}
 #print td.blank{color:#aaa}
 #print .disc{font-size:8.5pt;color:#666;margin-top:8mm}
 #print .wallet{display:flex;gap:6mm;flex-wrap:wrap}
 #print .wc{width:85.6mm;height:54mm;border:1px dashed #999;border-radius:3mm;padding:3.2mm 3.6mm;font-size:7.6pt;line-height:1.35;overflow:hidden}
 #print .wc .hd{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:10pt;color:#1F3A5F;border-bottom:1.5px solid #C8963E;margin-bottom:1.5mm;padding-bottom:.6mm}
 #print .wc b{font-weight:600}
}
.welcome .logo svg,.lockwrap>div>svg{width:100%;height:100%;display:block}
.inote>svg{width:24px;height:24px;flex:none;fill:none;stroke:var(--p);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tel{white-space:nowrap}

<script>/* Family Life Binder: pure logic (completeness, missing list, emergency card, dates). Used by the app and by test.js. */
(function (root) {
  "use strict";
  function filled(v) { return v !== undefined && v !== null && String(v).trim() !== ""; }
  function reqFields(g) { return g.fields.filter(function (f) { return f.req; }); }
  function itemDone(g, f) { return reqFields(g).every(function (r) { return filled(f && f[r.k]); }); }
  function secData(state, sid) { var s = state.sec && state.sec[sid]; return s || { na: false, g: {} }; }
  function groupVal(sd, g) { var v = sd.g && sd.g[g.id]; return g.single ? (v || {}) : (v || []); }

  // score 0..1 for one group, or null when an optional list group is empty (it does not count)
  function groupScore(sd, g) {
    var v = groupVal(sd, g), req = reqFields(g);
    if (g.single) {
      if (!req.length) return null;
      return req.filter(function (r) { return filled(v[r.k]); }).length / req.length;
    }
    if (!v.length) return g.opt ? null : 0;
    return v.filter(function (it) { return itemDone(g, it.f); }).length / v.length;
  }
  function sectionScore(sec, sd) {
    if (sd.na) return 1;
    var sc = sec.groups.map(function (g) { return groupScore(sd, g); }).filter(function (x) { return x !== null; });
    if (!sc.length) return 0;
    return sc.reduce(function (a, b) { return a + b; }, 0) / sc.length;
  }
  function sectionStarted(sec, sd) {
    return sec.groups.some(function (g) {
      var v = groupVal(sd, g);
      return g.single ? Object.keys(v).some(function (k) { return filled(v[k]); }) : v.length > 0;
    });
  }
  function pct(x) { return Math.round(x * 100); }
  function overview(schema, state) {
    var rows = schema.sections.map(function (sec) {
      var sd = secData(state, sec.id), sc = sectionScore(sec, sd), n = 0;
      sec.groups.forEach(function (g) { if (!g.single) n += groupVal(sd, g).length; });
      return { id: sec.id, name: sec.name, score: sc, pct: pct(sc), na: !!sd.na, started: sd.na || sectionStarted(sec, sd), items: n,
        status: sd.na ? "Not needed" : sc >= 0.999 ? "Done" : sectionStarted(sec, sd) ? "In progress" : "Not started" };
    });
    var tot = rows.reduce(function (a, r) { return a + r.score; }, 0) / rows.length;
    return { rows: rows, score: tot, pct: pct(tot), done: rows.filter(function (r) { return r.score >= 0.999; }).length };
  }
  // what's missing, in section order: one line per empty required group or unfinished item
  function missing(schema, state) {
    var out = [];
    schema.sections.forEach(function (sec) {
      var sd = secData(state, sec.id); if (sd.na) return;
      sec.groups.forEach(function (g) {
        var v = groupVal(sd, g), req = reqFields(g);
        if (g.single) {
          req.forEach(function (r) { if (!filled(v[r.k])) out.push({ sec: sec.id, group: g.id, field: r.k, text: sec.name + ": " + r.l }); });
        } else if (!v.length) {
          if (!g.opt) out.push({ sec: sec.id, group: g.id, text: sec.name + ": add " + (g.name === sec.name ? "the first one" : g.name.toLowerCase()) });
        } else v.forEach(function (it) {
          var miss = req.filter(function (r) { return !filled(it.f[r.k]); });
          if (miss.length) out.push({ sec: sec.id, group: g.id, item: it.id, text: sec.name + ": " + (it.f[g.title] || "an entry") + " needs " + miss.map(function (r) { return r.l.toLowerCase(); }).join(", ") });
        });
      });
    });
    return out;
  }
  function emergency(state) {
    var me = (secData(state, "about").g.me) || {}, med = secData(state, "medical").g, cont = secData(state, "contacts").g.people || [];
    var basics = med.basics || {}, docs = med.doctors || [], meds = med.meds || [];
    var first = cont.filter(function (c) { return c.f.first; });
    if (!first.length) first = cont.filter(function (c) { return c.f.role === "Emergency contact"; });
    var doc = docs.filter(function (d) { return d.f.type === "Family doctor"; })[0] || docs[0];
    return {
      name: me.known && me.name ? me.name + " (" + me.known + ")" : me.name || "", born: me.born || "", address: me.address || "",
      allergies: basics.allergies || "", conditions: basics.conditions || "", blood: basics.blood || "", donor: basics.donor || "",
      meds: meds.map(function (m) { return [m.f.name, m.f.dose, m.f.when].filter(filled).join(", "); }),
      call: first.slice(0, 3).map(function (c) { return { name: c.f.name || "", role: c.f.role || "", phone: c.f.phone || "" }; }),
      doctor: doc ? { name: doc.f.name || "", phone: doc.f.phone || "" } : null
    };
  }
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function fmtDate(iso, style) {
    if (!iso || !/^\d{4}-\d\d-\d\d/.test(iso)) return iso || "";
    var y = +iso.slice(0, 4), m = +iso.slice(5, 7), d = +iso.slice(8, 10);
    if (style === "iso") return iso.slice(0, 10);
    return style === "dmy" ? d + " " + MON[m - 1] + " " + y : MON[m - 1] + " " + d + ", " + y;
  }
  function daysBetween(a, b) { return Math.round((Date.parse(b.slice(0, 10)) - Date.parse(a.slice(0, 10))) / 864e5); }
  function ago(days) {
    if (days <= 0) return "today"; if (days === 1) return "yesterday"; if (days < 14) return days + " days ago";
    if (days < 60) return Math.round(days / 7) + " weeks ago"; var m = Math.round(days / 30.44);
    if (m < 24) return m + " months ago"; return Math.round(days / 365.25) + " years ago";
  }
  function checkup(state, today) {
    var months = (state.settings && state.settings.remind) || 6, last = state.checked;
    if (!last) return { last: null, due: true, text: "Not checked yet" };
    var d = daysBetween(last, today), dueIn = Math.round(months * 30.44) - d;
    return { last: last, days: d, due: dueIn <= 0, dueIn: dueIn, text: "Last checked " + ago(d) };
  }
  var API = { filled: filled, groupScore: groupScore, sectionScore: sectionScore, overview: overview, missing: missing, emergency: emergency,
    fmtDate: fmtDate, daysBetween: daysBetween, ago: ago, checkup: checkup, itemDone: itemDone };
  if (typeof module !== "undefined" && module.exports) module.exports = API; else root.Calc = API;
